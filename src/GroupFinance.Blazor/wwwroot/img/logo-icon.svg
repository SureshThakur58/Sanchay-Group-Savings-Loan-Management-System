<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="leafGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#E9CC82"/>
    </linearGradient>
  </defs>

  <!-- seal background -->
  <circle cx="100" cy="100" r="96" fill="#12283F"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#C9A24B" stroke-width="2.5"/>

  <!-- coin base -->
  <ellipse cx="100" cy="140" rx="36" ry="13" fill="#B78F3E"/>
  <ellipse cx="100" cy="136" rx="36" ry="13" fill="url(#leafGrad)"/>
  <line x1="84" y1="136" x2="116" y2="136" stroke="#12283F" stroke-width="3" stroke-linecap="round"/>

  <!-- three ascending sprout leaves, growing from the coin -->
  <path d="M100 132 C 90 110, 90 84, 100 60 C 110 84, 110 110, 100 132 Z" fill="url(#leafGrad)"/>
  <path d="M78 132 C 71 116, 73 96, 85 82 C 90 98, 87 118, 78 132 Z" fill="#B78F3E"/>
  <path d="M122 132 C 129 116, 127 96, 115 82 C 110 98, 113 118, 122 132 Z" fill="#B78F3E"/>
</svg>
